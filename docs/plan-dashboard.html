<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rust 一年学习 · TODO 看板</title>
<style>
  :root {
    --background: #fafafa;
    --foreground: #1c1c1e;
    --card: #ffffff;
    --card-foreground: #1c1c1e;
    --border: #e3e3e6;
    --input: #e3e3e6;
    --muted: #f2f2f4;
    --muted-foreground: #6b7280;
    --primary: #2563eb;
    --primary-foreground: #ffffff;
    --ring: #2563eb;
    --font-size-base: 14px;
  }
  [data-theme="dark"] {
    --background: #121214;
    --foreground: #f4f4f5;
    --card: #1b1b1f;
    --card-foreground: #f4f4f5;
    --border: #2c2c31;
    --input: #2c2c31;
    --muted: #232328;
    --muted-foreground: #9ca3af;
    --primary: #3b82f6;
    --primary-foreground: #ffffff;
    --ring: #3b82f6;
  }
  /* 强调色方案 */
  [data-accent="green"] { --primary: #10b981; --ring: #10b981; }
  [data-accent="purple"] { --primary: #8b5cf6; --ring: #8b5cf6; }
  [data-accent="orange"] { --primary: #f97316; --ring: #f97316; }
  [data-accent="rose"] { --primary: #f43f5e; --ring: #f43f5e; }
  [data-accent="teal"] { --primary: #14b8a6; --ring: #14b8a6; }
  [data-theme="dark"][data-accent="green"] { --primary: #34d399; --ring: #34d399; }
  [data-theme="dark"][data-accent="purple"] { --primary: #a78bfa; --ring: #a78bfa; }
  [data-theme="dark"][data-accent="orange"] { --primary: #fb923c; --ring: #fb923c; }
  [data-theme="dark"][data-accent="rose"] { --primary: #fb7185; --ring: #fb7185; }
  [data-theme="dark"][data-accent="teal"] { --primary: #2dd4bf; --ring: #2dd4bf; }
  /* 主题控制条 */
  .theme-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }
  .swatch {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid var(--border);
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
  }
  .swatch.is-active {
    border-color: var(--foreground);
    box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--foreground);
  }
  .swatch-blue { background: #3b82f6; }
  .swatch-green { background: #10b981; }
  .swatch-purple { background: #8b5cf6; }
  .swatch-orange { background: #f97316; }
  .swatch-rose { background: #f43f5e; }
  .swatch-teal { background: #14b8a6; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--background);
    color: var(--foreground);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: var(--font-size-base);
    line-height: 1.55;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 500; margin: 0 0 16px; }
  h2 { font-size: 17px; font-weight: 500; margin: 0 0 8px; }
  h3 { font-size: 15px; font-weight: 500; margin: 0; }
  code {
    background: var(--muted);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 12.5px;
  }
  .card {
    background: var(--card);
    color: var(--card-foreground);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }
  .progress {
    height: 12px;
    background: var(--muted);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: var(--primary);
    border-radius: 999px;
    transition: width 0.25s ease;
  }
  .viz-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }
  .nav {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 16px;
  }
  .nav-link {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--foreground);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 400;
    cursor: pointer;
  }
  .nav-link:hover { border-color: var(--primary); }
  .nav-link.active {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--primary-foreground);
  }
  .form-check {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    cursor: pointer;
    margin: 0;
  }
  .form-check-input {
    width: 15px;
    height: 15px;
    margin: 3px 0 0;
    accent-color: var(--primary);
    flex-shrink: 0;
    cursor: pointer;
  }
  .form-check-label { flex: 1; }
  .text-small { font-size: 12px; }
  .text-muted { color: var(--muted-foreground); }
  .text-nowrap { white-space: nowrap; }
  .text-center { text-align: center; }
  .tabular-nums { font-variant-numeric: tabular-nums; }
  .table-responsive { overflow-x: auto; }
  .table { width: 100%; border-collapse: collapse; }
  .table th, .table td {
    text-align: left;
    padding: 7px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .table th { color: var(--muted-foreground); font-weight: 500; }
  .table-sm th, .table-sm td { padding: 5px 8px; }
  .footer-note {
    margin-top: 20px;
    color: var(--muted-foreground);
    font-size: 12px;
  }
</style>
</head>

      });
    }
    function weekId(q, wi, ii) { return q.id + '-w' + wi + '-' + ii; }
    function tbId(ci, ii) { return 'tb-' + ci + '-' + ii; }
    function brId(b) { return 'br-' + b.id; }

    var checked = new Set();
    try {
      var raw = null;
      if (window.zcode && window.zcode.widgetState && window.zcode.widgetState.modelContent) {
        raw = window.zcode.widgetState.modelContent;
      } else {
        raw = localStorage.getItem(LS_KEY);
      }
      if (raw) {
        var arr = JSON.parse(raw);
        if (Array.isArray(arr)) checked = new Set(arr);
      }
    } catch (e) {}

    function persist() {
      var data = JSON.stringify(Array.from(checked));
      try { localStorage.setItem(LS_KEY, data); } catch (e) {}
      if (window.zcode && window.zcode.setWidgetState) {
        window.zcode.setWidgetState({ modelContent: data }).catch(function () {});
      }
    }

    // 主题（独立版）
    var THEME_KEY = 'rust-year-plan-theme';
    var ACCENT_KEY = 'rust-year-plan-accent';
    var htmlEl = document.documentElement;
    var btnTheme = document.getElementById('btn-theme');
    function currentTheme() {
      var t = null;
      try { t = localStorage.getItem(THEME_KEY); } catch (e) {}
      if (t === 'light' || t === 'dark') return t;
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    function applyTheme(mode) {
      htmlEl.setAttribute('data-theme', mode);
      btnTheme.textContent = mode === 'dark' ? '☀️ 亮色' : '🌙 暗色';
    }
    function applyAccent(name) {
      if (name) htmlEl.setAttribute('data-accent', name);
      else htmlEl.removeAttribute('data-accent');
      root.querySelectorAll('.swatch').forEach(function (s) {
        s.classList.toggle('is-active', (s.getAttribute('data-accent') || '') === (name || ''));
      });
    }
    applyTheme(currentTheme());
    var savedAccent = null;
    try { savedAccent = localStorage.getItem(ACCENT_KEY); } catch (e) {}
    applyAccent(savedAccent || '');
    btnTheme.addEventListener('click', function () {
      var next = htmlEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    });
    root.querySelectorAll('.swatch').forEach(function (s) {
      s.addEventListener('click', function () {
        var a = s.getAttribute('data-accent') || '';
        applyAccent(a);
        try { localStorage.setItem(ACCENT_KEY, a); } catch (e) {}
      });
    });

    function renderQuarter(q, panelId) {
      var panel = document.getElementById(panelId);
      var html = '<div class="quarter-top"><div class="week-head"><h2>' + esc(q.name) + '</h2></div>' +
        '<div class="progress" role="progressbar" aria-label="' + esc(q.name) + ' 进度" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">' +
        '<div class="progress-bar" data-qbar="' + q.id + '" style="width:0%"></div></div></div>';
      q.weeks.forEach(function (wk, wi) {
        var rows = wk.items.map(function (it, ii) {
          var id = weekId(q, wi, ii);
          ALL.push(id);
          var on = checked.has(id);
          return '<label class="form-check"><input class="form-check-input" type="checkbox" data-id="' + id + '"' + (on ? ' checked' : '') + '>' +
            '<span class="form-check-label">' + esc(it) + '</span></label>';
        }).join('');
        html += '<div class="card week-block"><div class="week-head"><h3>' + esc(wk.t) + '</h3>' +
          '<span class="text-small text-muted tabular-nums" data-wcount="' + q.id + '-w' + wi + '">0/' + wk.items.length + '</span></div>' +
          '<div class="check-list">' + rows + '</div></div>';
      });
      panel.innerHTML = html;
    }

    function renderToolbox() {
      var panel = document.getElementById('ryp-panel-tb');
      var html = '';
      TOOLBOX.forEach(function (cat, ci) {
        var rows = cat.items.map(function (it, ii) {
          var id = tbId(ci, ii);
          ALL.push(id);
          var on = checked.has(id);
          return '<label class="form-check"><input class="form-check-input" type="checkbox" data-id="' + id + '"' + (on ? ' checked' : '') + '>' +
            '<span class="form-check-label">' + esc(it) + '</span></label>';
        }).join('');
        html += '<div class="card tb-cat"><div class="week-head"><h3>' + esc(cat.name) + '</h3>' +
          '<span class="text-small text-muted tabular-nums" data-tbcount="' + ci + '">0/' + cat.items.length + '</span></div>' +
          '<div class="check-list">' + rows + '</div>' +
          '<div class="progress" role="progressbar" aria-label="' + esc(cat.name) + ' 进度" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">' +
          '<div class="progress-bar" data-tbbar="' + ci + '" style="width:0%"></div></div></div>';
      });
      panel.innerHTML = html;
    }

    function renderBranches() {
      var panel = document.getElementById('ryp-panel-br');
      var rows = BRANCHES.map(function (b) {
        var id = brId(b);
        ALL.push(id);
        var on = checked.has(id);
        return '<tr><td><code>' + b.id + '</code></td><td>' + esc(b.name) + '</td>' +
          '<td class="text-nowrap tabular-nums">' + b.hours + 'h</td><td class="text-nowrap">' + esc(b.entry) + '</td>' +
          '<td class="text-center"><input class="form-check-input" type="checkbox" data-id="' + id + '"' +
          ' aria-label="' + b.id + ' 出口题通过"' + (on ? ' checked' : '') + '></td></tr>';
      }).join('');
      panel.innerHTML = '<div class="table-responsive branch-table"><table class="table table-sm">' +
        '<thead><tr><th>ID</th><th>概念</th><th>时长</th><th>主线入口</th><th class="text-center">出口题通过</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table></div>';
    }

    function updateProgress() {
      var total = 0, done = 0;
      QUARTERS.forEach(function (q) {
        var qd = 0, qt = 0;
        q.weeks.forEach(function (wk, wi) {
          var wd = 0;
          wk.items.forEach(function (it, ii) {
            var id = weekId(q, wi, ii);
            total++; qt++;
            if (checked.has(id)) { done++; qd++; wd++; }
          });
          var el = root.querySelector('[data-wcount="' + q.id + '-w' + wi + '"]');
          if (el) el.textContent = wd + '/' + wk.items.length;
        });
        var bar = root.querySelector('[data-qbar="' + q.id + '"]');
        if (bar) {
          var pct = qt ? Math.round(100 * qd / qt) : 0;
          bar.style.width = pct + '%';
          bar.parentElement.setAttribute('aria-valuenow', pct);
        }
      });
      TOOLBOX.forEach(function (cat, ci) {
        var cd = 0;
        cat.items.forEach(function (it, ii) {
          total++;
          if (checked.has(tbId(ci, ii))) { done++; cd++; }
        });
        var el = root.querySelector('[data-tbcount="' + ci + '"]');
        if (el) el.textContent = cd + '/' + cat.items.length;
        var bar = root.querySelector('[data-tbbar="' + ci + '"]');
        if (bar) {
          var pct = Math.round(100 * cd / cat.items.length);
          bar.style.width = pct + '%';
          bar.parentElement.setAttribute('aria-valuenow', pct);
        }
      });
      BRANCHES.forEach(function (b) {
        total++;
        if (checked.has(brId(b))) done++;
      });
      var pctAll = total ? Math.round(100 * done / total) : 0;
      var ob = document.getElementById('ryp-overall-bar');
      ob.style.width = pctAll + '%';
      ob.parentElement.setAttribute('aria-valuenow', pctAll);
      document.getElementById('ryp-overall-count').textContent = done + ' / ' + total;
    }

    // 标签页切换（独立版自己实现）
    var tabs = root.querySelectorAll('.nav-link');
    tabs.forEach(function (btn) {
      btn.addEventListener('click', function () {
        tabs.forEach(function (b) {
          b.classList.remove('active');
          b.setAttribute('aria-selected', 'false');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-selected', 'true');
        var panels = root.querySelectorAll('[role="tabpanel"]');
        panels.forEach(function (p) { p.hidden = true; });
        var target = document.getElementById(btn.getAttribute('aria-controls'));
        if (target) target.hidden = false;
      });
    });

    root.addEventListener('change', function (e) {
      var inp = e.target;
      if (inp && inp.matches && inp.matches('input[data-id]')) {
        if (inp.checked) checked.add(inp.getAttribute('data-id'));
        else checked.delete(inp.getAttribute('data-id'));
        persist();
        updateProgress();
      }
    });

    window.addEventListener('zcode:set_globals', function (e) {
      var ws = e.detail && e.detail.globals && e.detail.globals.widgetState;
      if (ws && ws.modelContent) {
        try {
          var arr = JSON.parse(ws.modelContent);
          if (Array.isArray(arr)) { checked = new Set(arr); updateProgress(); }
        } catch (err) {}
      }
    });

    QUARTERS.forEach(function (q, i) { renderQuarter(q, 'ryp-panel-q' + (i + 1)); });
    renderToolbox();
    renderBranches();
    updateProgress();
  })();
  </script>
</div>
</div>
</body>
</html>
